name: Package and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test standalone packaging
        run: python -m unittest discover -s tests -v
      - name: Build release files
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="$(python -c 'import json; print("v" + json.load(open("package/inx_package.json"))["version"])')"
          if [ "$REF_TYPE" = tag ]; then
            tag="$REF_NAME"
          fi
          python release.py "$tag"
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-package
          path: dist/*
          if-no-files-found: error
      - name: Publish versioned plugin
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "$RELEASE_TAG" --notes-file RELEASE_NOTES.md
